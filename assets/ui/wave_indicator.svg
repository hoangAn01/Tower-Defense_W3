<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="10" y="10" width="180" height="80" fill="rgba(0, 0, 0, 0.8)" rx="10" stroke="#4CAF50" stroke-width="2" filter="url(#waveGlow)"/>
  
  <!-- Border glow -->
  <rect x="10" y="10" width="180" height="80" fill="none" stroke="rgba(76, 175, 80, 0.5)" stroke-width="4" rx="10"/>
  
  <!-- Wave number background -->
  <circle cx="100" cy="50" r="35" fill="url(#waveGradient)" opacity="0.2"/>
  
  <!-- Wave text placeholder -->
  <text x="100" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#4CAF50" text-anchor="middle">WAVE</text>
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle" id="waveNumber">1</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="5" fill="#4CAF50" opacity="0.6"/>
  <circle cx="150" cy="50" r="5" fill="#4CAF50" opacity="0.6"/>
  <line x1="60" y1="20" x2="80" y2="20" stroke="#4CAF50" stroke-width="2" opacity="0.6"/>
  <line x1="60" y1="80" x2="80" y2="80" stroke="#4CAF50" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="20" x2="140" y2="20" stroke="#4CAF50" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="80" x2="140" y2="80" stroke="#4CAF50" stroke-width="2" opacity="0.6"/>
</svg>
