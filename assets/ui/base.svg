<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <filter id="baseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer base -->
  <circle cx="50" cy="50" r="45" fill="#333" stroke="#555" stroke-width="3"/>
  
  <!-- Inner base -->
  <circle cx="50" cy="50" r="35" fill="url(#baseGradient)" stroke="#1B5E20" stroke-width="3" filter="url(#baseGlow)"/>
  
  <!-- Central structure -->
  <rect x="40" y="20" width="20" height="60" fill="#8BC34A" stroke="#689F38" stroke-width="2" rx="2"/>
  
  <!-- Top -->
  <circle cx="50" cy="15" r="10" fill="#AFB42B" stroke="#827717" stroke-width="2"/>
  
  <!-- Antenna -->
  <line x1="50" y1="5" x2="50" y2="15" stroke="#FBC02D" stroke-width="2"/>
  <circle cx="50" cy="5" r="3" fill="#FFD700" stroke="#FBC02D" stroke-width="1"/>
  
  <!-- Details -->
  <line x1="30" y1="40" x2="70" y2="40" stroke="#1B5E20" stroke-width="2"/>
  <line x1="30" y1="60" x2="70" y2="60" stroke="#1B5E20" stroke-width="2"/>
  
  <!-- Windows -->
  <rect x="42" y="30" width="6" height="8" fill="#4FC3F7" rx="1"/>
  <rect x="42" y="45" width="6" height="8" fill="#4FC3F7" rx="1"/>
  <rect x="52" y="30" width="6" height="8" fill="#4FC3F7" rx="1"/>
  <rect x="52" y="45" width="6" height="8" fill="#4FC3F7" rx="1"/>
</svg>
