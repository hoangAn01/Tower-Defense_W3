<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="endGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336"/>
      <stop offset="100%" style="stop-color:#D32F2F"/>
    </linearGradient>
    <filter id="endGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="endAura" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgba(244, 67, 54, 0.8)"/>
      <stop offset="100%" style="stop-color:rgba(244, 67, 54, 0)"/>
    </radialGradient>
  </defs>
  
  <!-- Aura -->
  <circle cx="50" cy="50" r="45" fill="url(#endAura)" opacity="0.6"/>
  
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#endGradient)" stroke-width="4" stroke-dasharray="10,5" filter="url(#endGlow)"/>
  
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="30" fill="url(#endGradient)" stroke="#B71C1C" stroke-width="3"/>
  
  <!-- Skull symbol -->
  <circle cx="50" cy="40" r="12" fill="#FFFFFF" stroke="#B71C1C" stroke-width="2"/>
  <rect x="44" y="45" width="3" height="8" fill="#B71C1C"/>
  <rect x="53" y="45" width="3" height="8" fill="#B71C1C"/>
  <circle cx="42" cy="42" r="2" fill="#B71C1C"/>
  <circle cx="58" cy="42" r="2" fill="#B71C1C"/>
  <path d="M45 50 Q50 55 55 50" stroke="#B71C1C" stroke-width="2" fill="none"/>
  
  <!-- Warning lines -->
  <line x1="30" y1="25" x2="20" y2="15" stroke="#FF9800" stroke-width="2"/>
  <line x1="70" y1="25" x2="80" y2="15" stroke="#FF9800" stroke-width="2"/>
  <line x1="30" y1="75" x2="20" y2="85" stroke="#FF9800" stroke-width="2"/>
  <line x1="70" y1="75" x2="80" y2="85" stroke="#FF9800" stroke-width="2"/>
  
  <!-- Sparkles -->
  <circle cx="25" cy="25" r="2" fill="#FF9800" opacity="0.8"/>
  <circle cx="75" cy="25" r="2" fill="#FF9800" opacity="0.8"/>
  <circle cx="25" cy="75" r="2" fill="#FF9800" opacity="0.8"/>
  <circle cx="75" cy="75" r="2" fill="#FF9800" opacity="0.8"/>
</svg>
