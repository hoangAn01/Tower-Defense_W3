<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="basicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#45a049"/>
    </linearGradient>
    <filter id="basicGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base -->
  <circle cx="50" cy="75" r="25" fill="#333" stroke="#555" stroke-width="2"/>
  
  <!-- Tower body -->
  <circle cx="50" cy="50" r="20" fill="url(#basicGradient)" stroke="#388E3C" stroke-width="2" filter="url(#basicGlow)"/>
  
  <!-- Tower top -->
  <circle cx="50" cy="30" r="12" fill="#8BC34A" stroke="#689F38" stroke-width="1.5"/>
  
  <!-- Barrel -->
  <rect x="47" y="15" width="6" height="15" fill="#2E7D32" rx="1"/>
  
  <!-- Details -->
  <circle cx="50" cy="45" r="3" fill="#2E7D32"/>
  <circle cx="50" cy="55" r="3" fill="#2E7D32"/>
  
  <!-- Range indicator (optional) -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="rgba(76, 175, 80, 0.3)" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
</svg>
