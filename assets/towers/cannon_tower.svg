<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cannonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#F57C00"/>
    </linearGradient>
    <filter id="cannonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base -->
  <circle cx="50" cy="78" r="28" fill="#333" stroke="#555" stroke-width="2"/>
  
  <!-- Tower body -->
  <circle cx="50" cy="55" r="22" fill="url(#cannonGradient)" stroke="#E65100" stroke-width="2" filter="url(#cannonGlow)"/>
  
  <!-- Tower top -->
  <circle cx="50" cy="40" r="10" fill="#FFB74D" stroke="#F57C00" stroke-width="1.5"/>
  
  <!-- Cannon barrel -->
  <rect x="35" y="35" width="30" height="12" fill="#BF360C" rx="2"/>
  
  <!-- Cannon mouth -->
  <circle cx="65" cy="41" r="5" fill="#263238" stroke="#455A64" stroke-width="1"/>
  
  <!-- Details -->
  <circle cx="50" cy="50" r="4" fill="#BF360C"/>
  <line x1="40" y1="50" x2="60" y2="50" stroke="#BF360C" stroke-width="2"/>
  
  <!-- Wheels -->
  <circle cx="35" cy="75" r="6" fill="#555" stroke="#777" stroke-width="1"/>
  <circle cx="65" cy="75" r="6" fill="#555" stroke="#777" stroke-width="1"/>
  
  <!-- Range indicator -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255, 152, 0, 0.3)" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
</svg>
