<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Body (streamlined) -->
  <ellipse cx="50" cy="50" rx="30" ry="25" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
  <!-- Head -->
  <circle cx="50" cy="30" r="12" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
  <!-- Eyes (alert) -->
  <circle cx="45" cy="28" r="2" fill="#FFD700"/>
  <circle cx="55" cy="28" r="2" fill="#FFD700"/>
  <!-- Speed lines -->
  <line x1="15" y1="45" x2="5" y2="45" stroke="#42A5F5" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="55" x2="8" y2="55" stroke="#42A5F5" stroke-width="2" stroke-linecap="round"/>
  <!-- Tail spikes -->
  <line x1="75" y1="40" x2="85" y2="35" stroke="#1565C0" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="50" x2="85" y2="50" stroke="#1565C0" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="60" x2="85" y2="65" stroke="#1565C0" stroke-width="2" stroke-linecap="round"/>
</svg>