<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fastEnemyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>
    <filter id="fastEnemyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Aura effect -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(33, 150, 243, 0.3)" stroke-width="2" stroke-dasharray="10,5" opacity="0.6" filter="url(#fastEnemyGlow)"/>
  
  <!-- Body -->
  <ellipse cx="50" cy="60" rx="20" ry="18" fill="url(#fastEnemyGradient)" stroke="#1565C0" stroke-width="2" filter="url(#fastEnemyGlow)"/>
  
  <!-- Head -->
  <circle cx="50" cy="35" r="12" fill="#1976D2" stroke="#0D47A1" stroke-width="1.5"/>
  
  <!-- Eyes -->
  <circle cx="45" cy="32" r="3" fill="#FFFFFF" stroke="#E0F2F1" stroke-width="1"/>
  <circle cx="55" cy="32" r="3" fill="#FFFFFF" stroke="#E0F2F1" stroke-width="1"/>
  <circle cx="45" cy="32" r="1.5" fill="#01579B"/>
  <circle cx="55" cy="32" r="1.5" fill="#01579B"/>
  
  <!-- Mouth -->
  <path d="M45 38 Q50 41 55 38" stroke="#FFD700" stroke-width="1.5" fill="none"/>
  
  <!-- Speed lines effect -->
  <line x1="30" y1="45" x2="20" y2="40" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="45" x2="80" y2="40" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="55" x2="15" y2="50" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" stroke-linecap="round"/>
  <line x1="75" y1="55" x2="85" y2="50" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Health bar background -->
  <rect x="25" y="15" width="50" height="4" fill="#000" rx="2" opacity="0.8"/>
  <!-- Health bar fill -->
  <rect x="26" y="16" width="48" height="2" fill="#FFEB3B" rx="1"/>
</svg>
