<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tankEnemyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0"/>
      <stop offset="100%" style="stop-color:#7B1FA2"/>
    </linearGradient>
    <filter id="tankEnemyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>
  
  <!-- Body -->
  <ellipse cx="50" cy="65" rx="30" ry="25" fill="url(#tankEnemyGradient)" stroke="#6A1B9A" stroke-width="3" filter="url(#tankEnemyShadow)"/>
  
  <!-- Armor plates -->
  <rect x="25" y="55" width="12" height="15" fill="#7B1FA2" stroke="#4A148C" stroke-width="1" rx="1"/>
  <rect x="63" y="55" width="12" height="15" fill="#7B1FA2" stroke="#4A148C" stroke-width="1" rx="1"/>
  
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#6A1B9A" stroke="#4A148C" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="42" cy="32" r="4" fill="#FFD700" stroke="#FF9800" stroke-width="1.5"/>
  <circle cx="58" cy="32" r="4" fill="#FFD700" stroke="#FF9800" stroke-width="1.5"/>
  <circle cx="42" cy="32" r="2" fill="#263238"/>
  <circle cx="58" cy="32" r="2" fill="#263238"/>
  
  <!-- Mouth -->
  <path d="M42 40 Q50 45 58 40" stroke="#FF5722" stroke-width="2" fill="none"/>
  
  <!-- Arms -->
  <rect x="15" y="55" width="20" height="12" fill="#5D1E88" rx="2"/>
  <rect x="65" y="55" width="20" height="12" fill="#5D1E88" rx="2"/>
  
  <!-- Legs -->
  <ellipse cx="35" cy="85" rx="12" ry="15" fill="#4A148C" stroke="#280D5F" stroke-width="1.5"/>
  <ellipse cx="65" cy="85" rx="12" ry="15" fill="#4A148C" stroke="#280D5F" stroke-width="1.5"/>
  
  <!-- Armor details -->
  <line x1="30" y1="60" x2="40" y2="60" stroke="#FF9800" stroke-width="2"/>
  <line x1="60" y1="60" x2="70" y2="60" stroke="#FF9800" stroke-width="2"/>
  <line x1="35" y1="70" x2="45" y2="70" stroke="#FF9800" stroke-width="2"/>
  <line x1="55" y1="70" x2="65" y2="70" stroke="#FF9800" stroke-width="2"/>
  
  <!-- Health bar background -->
  <rect x="20" y="15" width="60" height="6" fill="#000" rx="3" opacity="0.8"/>
  <!-- Health bar fill -->
  <rect x="21" y="16" width="58" height="4" fill="#FF9800" rx="2"/>
</svg>
