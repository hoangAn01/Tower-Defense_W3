<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Main body (large) -->
  <ellipse cx="50" cy="55" rx="38" ry="30" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2"/>
  <!-- Head/Turret -->
  <circle cx="50" cy="25" r="18" fill="#6A1B9A" stroke="#4A148C" stroke-width="2"/>
  <!-- Gun barrel -->
  <rect x="45" y="8" width="10" height="18" rx="2" fill="#4A148C" stroke="#2A0845" stroke-width="1"/>
  <!-- Eyes (serious) -->
  <circle cx="42" cy="22" r="3" fill="#FF9800"/>
  <circle cx="58" cy="22" r="3" fill="#FF9800"/>
  <!-- Armor plating -->
  <rect x="20" y="40" width="20" height="8" fill="#7B1FA2" stroke="#6A1B9A" stroke-width="1" rx="2"/>
  <rect x="60" y="40" width="20" height="8" fill="#7B1FA2" stroke="#6A1B9A" stroke-width="1" rx="2"/>
  <!-- Glow effect (armor) -->
  <circle cx="50" cy="55" r="40" fill="none" stroke="#FF9800" stroke-width="1" opacity="0.3"/>
</svg>