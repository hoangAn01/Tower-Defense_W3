<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Main body (massive) -->
  <circle cx="50" cy="55" r="42" fill="#F44336" stroke="#C62828" stroke-width="3"/>
  <!-- Head -->
  <circle cx="50" cy="20" r="22" fill="#C62828" stroke="#B71C1C" stroke-width="2"/>
  <!-- Horns -->
  <polygon points="30,5 25,0 28,10" fill="#FFEB3B" stroke="#F57F17" stroke-width="1"/>
  <polygon points="70,5 75,0 72,10" fill="#FFEB3B" stroke="#F57F17" stroke-width="1"/>
  <!-- Eyes (angry) -->
  <circle cx="40" cy="16" r="4" fill="#FFEB3B"/>
  <circle cx="60" cy="16" r="4" fill="#FFEB3B"/>
  <!-- Pupils (menacing) -->
  <circle cx="40" cy="16" r="2" fill="#000"/>
  <circle cx="60" cy="16" r="2" fill="#000"/>
  <!-- Mouth (evil grin) -->
  <path d="M 40 25 Q 50 30 60 25" stroke="#FFEB3B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Spikes on body -->
  <polygon points="20,50 15,45 18,55" fill="#FFEB3B"/>
  <polygon points="80,50 85,45 82,55" fill="#FFEB3B"/>
  <polygon points="50,88 50,95 45,90" fill="#FFEB3B"/>
  <!-- Aura -->
  <circle cx="50" cy="55" r="45" fill="none" stroke="#FFEB3B" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
</svg>