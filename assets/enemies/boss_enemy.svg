<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bossEnemyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336"/>
      <stop offset="50%" style="stop-color:#D32F2F"/>
      <stop offset="100%" style="stop-color:#B71C1C"/>
    </linearGradient>
    <radialGradient id="bossAura" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgba(244, 67, 54, 0.8)"/>
      <stop offset="100%" style="stop-color:rgba(244, 67, 54, 0)"/>
    </radialGradient>
    <filter id="bossGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Aura -->
  <circle cx="50" cy="50" r="45" fill="url(#bossAura)" opacity="0.7"/>
  
  <!-- Body -->
  <ellipse cx="50" cy="65" rx="35" ry="28" fill="url(#bossEnemyGradient)" stroke="#C62828" stroke-width="4" filter="url(#bossGlow)"/>
  
  <!-- Armor plates -->
  <rect x="20" y="50" width="15" height="20" fill="#C62828" stroke="#8B0000" stroke-width="2" rx="2"/>
  <rect x="65" y="50" width="15" height="20" fill="#C62828" stroke="#8B0000" stroke-width="2" rx="2"/>
  <rect x="35" y="40" width="30" height="15" fill="#C62828" stroke="#8B0000" stroke-width="2" rx="2"/>
  
  <!-- Head -->
  <circle cx="50" cy="30" r="22" fill="#D32F2F" stroke="#8B0000" stroke-width="3"/>
  
  <!-- Eyes (glowing) -->
  <circle cx="38" cy="28" r="5" fill="#FFEB3B" stroke="#FBC02D" stroke-width="2"/>
  <circle cx="62" cy="28" r="5" fill="#FFEB3B" stroke="#FBC02D" stroke-width="2"/>
  <circle cx="38" cy="28" r="2.5" fill="#263238"/>
  <circle cx="62" cy="28" r="2.5" fill="#263238"/>
  
  <!-- Horns -->
  <path d="M30 18 L25 10 L30 18" fill="#8B0000" stroke="#5D0000" stroke-width="1"/>
  <path d="M70 18 L75 10 L70 18" fill="#8B0000" stroke="#5D0000" stroke-width="1"/>
  
  <!-- Mouth -->
  <path d="M38 36 Q50 42 62 36" stroke="#FF9800" stroke-width="3" fill="none"/>
  
  <!-- Arms -->
  <rect x="10" y="60" width="25" height="15" fill="#8B0000" rx="3"/>
  <rect x="65" y="60" width="25" height="15" fill="#8B0000" rx="3"/>
  
  <!-- Legs -->
  <ellipse cx="30" cy="90" rx="15" ry="18" fill="#8B0000" stroke="#5D0000" stroke-width="2"/>
  <ellipse cx="70" cy="90" rx="15" ry="18" fill="#8B0000" stroke="#5D0000" stroke-width="2"/>
  
  <!-- Crown -->
  <path d="M40 15 L45 8 L50 15 L55 8 L60 15 L55 12 L50 18 L45 12 Z" fill="#FFD700" stroke="#FBC02D" stroke-width="1"/>
  
  <!-- Health bar background -->
  <rect x="15" y="10" width="70" height="8" fill="#000" rx="4" opacity="0.9"/>
  <!-- Health bar fill -->
  <rect x="16" y="11" width="68" height="6" fill="#FFEB3B" rx="3"/>
  
  <!-- Spike details -->
  <circle cx="25" cy="70" r="3" fill="#FFD700"/>
  <circle cx="75" cy="70" r="3" fill="#FFD700"/>
  <circle cx="20" cy="80" r="3" fill="#FFD700"/>
  <circle cx="80" cy="80" r="3" fill="#FFD700"/>
</svg>
