<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="normalEnemyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#666"/>
      <stop offset="100%" style="stop-color:#888"/>
    </linearGradient>
    <filter id="normalEnemyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>
  
  <!-- Body -->
  <ellipse cx="50" cy="60" rx="25" ry="20" fill="url(#normalEnemyGradient)" stroke="#555" stroke-width="2" filter="url(#normalEnemyShadow)"/>
  
  <!-- Head -->
  <circle cx="50" cy="35" r="15" fill="#555" stroke="#444" stroke-width="1.5"/>
  
  <!-- Eyes -->
  <circle cx="45" cy="32" r="3" fill="#FFEB3B" stroke="#F57C00" stroke-width="1"/>
  <circle cx="55" cy="32" r="3" fill="#FFEB3B" stroke="#F57C00" stroke-width="1"/>
  <circle cx="45" cy="32" r="1.5" fill="#263238"/>
  <circle cx="55" cy="32" r="1.5" fill="#263238"/>
  
  <!-- Mouth -->
  <path d="M45 40 Q50 43 55 40" stroke="#FF9800" stroke-width="2" fill="none"/>
  
  <!-- Arms -->
  <rect x="20" y="50" width="15" height="8" fill="#777" rx="2"/>
  <rect x="65" y="50" width="15" height="8" fill="#777" rx="2"/>
  
  <!-- Legs -->
  <ellipse cx="40" cy="80" rx="8" ry="12" fill="#555" stroke="#444" stroke-width="1"/>
  <ellipse cx="60" cy="80" rx="8" ry="12" fill="#555" stroke="#444" stroke-width="1"/>
  
  <!-- Health bar background -->
  <rect x="25" y="15" width="50" height="4" fill="#333" rx="2"/>
  <!-- Health bar fill -->
  <rect x="26" y="16" width="48" height="2" fill="#4CAF50" rx="1"/>
</svg>
