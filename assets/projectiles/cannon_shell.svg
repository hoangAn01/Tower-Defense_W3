<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cannonShellGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#F57C00"/>
    </linearGradient>
    <radialGradient id="explosionGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgba(255, 152, 0, 0.8)"/>
      <stop offset="100%" style="stop-color:rgba(255, 152, 0, 0)"/>
    </radialGradient>
    <filter id="cannonShellGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Shell body -->
  <circle cx="50" cy="50" r="25" fill="url(#cannonShellGradient)" stroke="#E65100" stroke-width="3" filter="url(#cannonShellGlow)"/>
  
  <!-- Shell tip -->
  <circle cx="50" cy="25" r="8" fill="#BF360C" stroke="#8B0000" stroke-width="2"/>
  
  <!-- Shell base -->
  <circle cx="50" cy="75" r="10" fill="#8B0000" stroke="#5D0000" stroke-width="2"/>
  
  <!-- Explosive indicator -->
  <path d="M40 40 L45 45 L50 40 L55 45 L60 40 L55 35 L50 40 L45 35 Z" fill="#FFEB3B" stroke="#FBC02D" stroke-width="1"/>
  
  <!-- Trail effect -->
  <ellipse cx="50" cy="85" rx="20" ry="10" fill="rgba(255, 152, 0, 0.4)" opacity="0.6"/>
  <ellipse cx="50" cy="90" rx="15" ry="7" fill="rgba(255, 152, 0, 0.3)" opacity="0.4"/>
  
  <!-- Fire effect -->
  <path d="M50 20 Q45 15 40 20 Q45 25 50 20" fill="rgba(255, 87, 34, 0.6)" opacity="0.7"/>
  <path d="M50 20 Q55 15 60 20 Q55 25 50 20" fill="rgba(255, 87, 34, 0.6)" opacity="0.7"/>
  <path d="M50 15 Q48 10 45 15 Q48 20 50 15" fill="rgba(244, 67, 54, 0.8)" opacity="0.5"/>
  <path d="M50 15 Q52 10 55 15 Q52 20 50 15" fill="rgba(244, 67, 54, 0.8)" opacity="0.5"/>
  
  <!-- Sparkle effects -->
  <circle cx="35" cy="45" r="2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="65" cy="45" r="2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="40" cy="60" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="60" cy="60" r="1.5" fill="#FFFFFF" opacity="0.7"/>
</svg>
