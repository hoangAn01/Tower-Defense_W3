<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Shell body -->
  <circle cx="50" cy="50" r="12" fill="#FF9800" stroke="#F57C00" stroke-width="2"/>
  <!-- Explosive tip -->
  <polygon points="50,30 58,45 42,45" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  <!-- Ridges -->
  <line x1="35" y1="50" x2="45" y2="50" stroke="#F57C00" stroke-width="1"/>
  <line x1="55" y1="50" x2="65" y2="50" stroke="#F57C00" stroke-width="1"/>
  <!-- Glow (explosion ready) -->
  <circle cx="50" cy="50" r="16" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
</svg>