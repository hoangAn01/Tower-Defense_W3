<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense W3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="game-stats">
                <div class="stat">
                    <span class="stat-label">Health:</span>
                    <span id="baseHealth" class="stat-value">100</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Gold:</span>
                    <span id="gold" class="stat-value">100</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Wave:</span>
                    <span id="wave" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Lives:</span>
                    <span id="lives" class="stat-value">3</span>
                </div>
            </div>
            <div class="game-controls">
                <button id="startWaveBtn" class="btn btn-primary">Start Wave</button>
                <button id="restartBtn" class="btn btn-secondary">Restart</button>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <div class="tower-menu">
                <div class="tower-option" data-tower-type="basic" data-cost="50">
                    <div class="tower-icon basic">
                        <img src="assets/towers/basic_tower.svg" alt="Basic Tower" class="tower-svg">
                    </div>
                    <div class="tower-info">
                        <span class="tower-name">Basic Tower</span>
                        <span class="tower-cost">50g</span>
                    </div>
                </div>
                <div class="tower-option" data-tower-type="sniper" data-cost="100">
                    <div class="tower-icon sniper">
                        <img src="assets/towers/sniper_tower.svg" alt="Sniper Tower" class="tower-svg">
                    </div>
                    <div class="tower-info">
                        <span class="tower-name">Sniper Tower</span>
                        <span class="tower-cost">100g</span>
                    </div>
                </div>
                <div class="tower-option" data-tower-type="cannon" data-cost="150">
                    <div class="tower-icon cannon">
                        <img src="assets/towers/cannon_tower.svg" alt="Cannon Tower" class="tower-svg">
                    </div>
                    <div class="tower-info">
                        <span class="tower-name">Cannon Tower</span>
                        <span class="tower-cost">150g</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="game-footer">
            <div id="gameMessage" class="game-message"></div>
            <div id="selectedTower" class="selected-tower-info">
                Selected: <span id="selectedTowerName">None</span>
                <button id="cancelPlacement" class="btn btn-cancel" style="display: none;">Cancel</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
